<style>

.chrome{background:#e4e6eb}
.tabs{display:flex;align-items:flex-end;gap:.2em;padding:.35em .35em 0;min-width:0}

.tool{display:flex;align-items:center;gap:.1em;padding:.15em .25em .25em;background:#fff;border-bottom:2px solid #d6d9e0}

  if(P.type === "sim"){ var a = []; for(var i = 0; i < P.tasks.length; i++) a.push(P.id + "t" + i); return a; }
  var b = []; for(var j = 0; j < P.items.length; j++) if(P.items[j].k !== "page") b.push(P.items[j].id); return b;

function stepOf(P){ return S.step[P.id] || 0; }
function taskSeq(P){
  var n = P.tasks.length;
  if(!P.shuffleTasks) return range(n);
  if(!S.seq[P.id] || S.seq[P.id].length !== n){
    var mid = range(n), head = [], tail = [];
    if(P.keepFirst) head.push(mid.shift());
    if(P.keepLast) tail.push(mid.pop());
    S.seq[P.id] = head.concat(shuffle(mid), tail);
  }
  return S.seq[P.id];
}
function remaining(P){
  if(P.type === "sim") return P.tasks.length - stepOf(P);
  var ks = scored(P), r = 0; for(var i = 0; i < ks.length; i++) if(!S.ans[ks[i]]) r++; return r;
}
function answeredN(P){ var ks = scored(P), n = 0; for(var i = 0; i < ks.length; i++) if(S.ans[ks[i]]) n++; return n; }
function rightN(P){ var ks = scored(P), n = 0; for(var i = 0; i < ks.length; i++) if(S.ans[ks[i]] && S.ans[ks[i]].ok) n++; return n; }
function totals(){ var r = 0, a = 0; for(var i = 0; i < PARTS.length; i++){ r += rightN(PARTS[i]); a += answeredN(PARTS[i]); } return {r:r, a:a}; }

var CUR = null;
function hit(id, label, cls, kids){
  var c = "hit" + (cls ? " " + cls : "");
  if(FLASH && FLASH.id === id) c += FLASH.ok ? " okf" : " nof";
  return h("button", {cls:c, "data-hit":id, "aria-label":label, onclick:function(){ simTap(CUR, id, label); }}, kids);
}
function isTarget(T, id){ if(T.target instanceof Array) return T.target.indexOf(id) > -1; return T.target === id; }
function wrongMsg(id, label, P){
  if(/^w\d/.test(id)){
    for(var i = 0; i < P.tasks.length; i++) if(P.tasks[i].target === id) return "Yes, that is a mistake too. But it is not this one. Read the code again.";
    return "Not that word. Read the hint and look again.";
  }
  if(/^c\d/.test(id)) return "Not the best one. Read them again.";
  if(/^o\d/.test(id)) return "Not that line yet. Read the hint again.";
  return "That is " + label + ". Try again.";
}
function simTap(P, id, label){
  var st = stepOf(P);
  if(st >= P.tasks.length) return;
  var seq = taskSeq(P), ti = seq[st], T = P.tasks[ti], key = P.id + "t" + ti;
  if(isTarget(T, id)){
    if(!S.ans[key]) S.ans[key] = {ok:true, pick:label};
    S.step[P.id] = st + 1; S.fb[P.id] = {ok:true, msg:T.why}; FLASH = {id:id, ok:true};
  } else {
    var other = false;
    if(/^w\d/.test(id)) for(var i = 0; i < P.tasks.length; i++) if(P.tasks[i].target === id) other = true;
    if(!S.ans[key] && !other) S.ans[key] = {ok:false, pick:label};
    S.fb[P.id] = {ok:false, msg:wrongMsg(id, label, P)}; FLASH = {id:id, ok:false};
  }
  save(true); renderKeep();
}

/* ===================== QUESTION CARDS ===================== */
function itemOrder(P){
  var idx = []; for(var i = 0; i < P.items.length; i++) idx.push(i);
  if(!P.shuffleQ) return idx;
  if(!S.seq[P.id]){ S.seq[P.id] = shuffle(idx); save(); }
  return S.seq[P.id];
}
function optOrder(it){
  if(it.k === "fixed") return range(it.opts.length);
  if(!S.ord[it.id]){ S.ord[it.id] = shuffle(range(it.opts.length)); save(); }
  return S.ord[it.id];
}
function correctIdx(it){ return it.k === "fixed" ? it.ans : 0; }
function renderCard(P, it, n){
  var a = S.ans[it.id], ci = correctIdx(it);
  var card = h("div", {cls:"card" + (a ? (a.ok ? " ok" : " no") : ""), id:"c-" + it.id});
  card.appendChild(h("div", {cls:"chead"}, [h("span", {cls:"num"}, String(n)), it.tag ? h("span", {cls:"tag"}, it.tag) : null]));
  if(it.show) card.appendChild(h("div", {cls:"showtxt"}, it.show));
  card.appendChild(h("div", {cls:"q"}, it.q));
  if(it.pg) card.appendChild(h("button", {cls:"chg", style:"margin:0 0 .3em", onclick:function(){ var pg = document.getElementById("page-" + it.pg); if(pg) pg.scrollIntoView({behavior:REDUCED ? "auto" : "smooth"}); }}, "\u2191 See the page"));
  var ord = optOrder(it);
  for(var j = 0; j < ord.length; j++){
    (function(oi){
      var cls = "opt", mk = "";
      if(a){ if(oi === ci){ cls += " right"; mk = "\u2713"; } else if(a.pick === it.opts[oi]){ cls += " wrong"; mk = "\u2717"; } else cls += " dim"; }
      card.appendChild(h("button", {cls:cls, onclick:function(){
        if(S.ans[it.id]) return;
        S.ans[it.id] = {ok:oi === ci, pick:it.opts[oi]}; S.last = P.id; save(true); renderKeep();
      }}, [h("span", {cls:"ol"}, "ABCDE".charAt(j)), h("span", {cls:"tx"}, it.opts[oi]), mk ? h("span", {cls:"mk"}, mk) : null]));
    })(ord[j]);
  }
  if(a){
    card.appendChild(h("div", {cls:"fb" + (a.ok ? " good" : "")}, [h("b", null, a.ok ? "Yes! That's right." : "Not quite. The answer is: " + it.opts[ci]), it.why]));
    card.appendChild(h("button", {cls:"chg", onclick:function(){ delete S.ans[it.id]; save(true); renderKeep(); }}, "\u21BA Change my answer"));
  }
  return card;
}
function renderQ(P, w){
  if(P.note){ var ps = []; for(var x = 0; x < P.note.length; x++) ps.push(h("p", null, P.note[x])); w.appendChild(note("", "i", ps)); }
  var ord = itemOrder(P), n = 0;
  for(var i = 0; i < ord.length; i++){
    var it = P.items[ord[i]];
    if(it.k === "page"){ w.appendChild(staticPage(it.page)); continue; }
    n++; w.appendChild(renderCard(P, it, n));
  }
}

  document.body.className = "g" + P.grp; var co = colOf(P); document.body.style.setProperty("--pc", co.c); document.body.style.setProperty("--pc-ink", co.ink); document.body.style.setProperty("--pc-tint", co.tint); document.body.style.setProperty("--tagc", PCOL[P.id] ? co.c : "#8A5300"); setAddr("part-" + P.id.toLowerCase());

function partSummary(P){
  var ks = scored(P), wrong = [];
  for(var i = 0; i < ks.length; i++) if(S.ans[ks[i]] && !S.ans[ks[i]].ok) wrong.push(ks[i]);
  var box = h("div", {cls:"summary"}, [h("b", null, "\uD83C\uDF89 Page finished! You got " + rightN(P) + " of " + ks.length + " right.")]);

    for(var j = 0; j < wrong.length; j++){ (function(k){ r.appendChild(h("button", {cls:"mchip", onclick:function(){ flashCard(k); }}, "Question " + cardNum(P, k))); })(wrong[j]); }
    box.appendChild(r);
  }
  if(P.type === "q") box.appendChild(h("button", {cls:"chg", onclick:function(){ if(confirmTwice(this, "Tap again to clear this part")){ resetPart(P); renderTop(); } }}, "\u21BB Try this part again"));
  return box;
}
function cardNum(P, key){ var ord = itemOrder(P), n = 0; for(var i = 0; i < ord.length; i++){ var it = P.items[ord[i]]; if(it.k === "page") continue; n++; if(it.id === key) return n; } return "?"; }
function flashCard(key){

  return null;
}

var pillEl = null;

function mistakes(){

    var P = PARTS[i];

      for(var s = 0; s < seq.length; s++){ var ti = seq[s], a = S.ans[P.id + "t" + ti]; if(a && !a.ok){ var T = P.tasks[ti];
        list.push({P:P, pi:i, q:T.t, you:a.pick, right:rightLabel(P, T), why:T.why, sim:true}); } } }

  }

}
